<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>The Neighbourhood</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
        background: #f3eee7;
        color: #2c2c2c;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        text-align: center;
      }
      main {
        max-width: 320px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 8px;
      }
      p {
        font-size: 14px;
        line-height: 1.5;
        color: #706a62;
        margin: 0 0 20px;
      }
      button {
        border: none;
        border-radius: 999px;
        padding: 12px 24px;
        font-size: 14px;
        font-weight: 600;
        background: #71846d;
        color: #fffdfc;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You&rsquo;re offline.</h1>
      <p>The Neighbourhood needs a connection to load. It&rsquo;ll pick up right where you left off once you&rsquo;re back online.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
